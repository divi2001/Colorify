<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>20 Color Palettes</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .family { margin-bottom: 20px; }
    .swatch { display:inline-block; width:40px; height:40px; border-radius:6px; margin:3px; border:1px solid #ccc; }
    .palette { display:flex; align-items:center; margin: 12px 0; flex-wrap:wrap; }
    .palette span { width:100px; font-size:14px; margin-right:10px; }
    .palette div { width:40px; height:40px; border-radius:6px; margin:2px; border:1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Color Classification (Green Excluded)</h2>
  <div id="families"></div>

  <h2>Original Palette (20 colors)</h2>
  <div id="original"></div>

  <h2>Generated Palettes</h2>
  <div id="palettes"></div>

<script>
function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h *= 60;
    }
    return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}
function hslToRgb(h, s, l) {
    s/=100; l/=100;
    let c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
    let r=0,g=0,b=0;
    if (h<60){r=c;g=x;}
    else if(h<120){r=x;g=c;}
    else if(h<180){g=c;b=x;}
    else if(h<240){b=c;g=x;}
    else if(h<300){r=x;b=c;}
    else {r=c;b=x;}
    r=Math.round((r+m)*255); g=Math.round((g+m)*255); b=Math.round((b+m)*255);
    return [r,g,b];
}
function hexToRgb(hex) {
    hex=hex.replace("#","");
    let bigint=parseInt(hex,16);
    return [(bigint>>16)&255,(bigint>>8)&255,bigint&255];
}
function shuffleArray(arr) { return arr.sort(()=>Math.random()-0.5); }
function isBackgroundColor(color){ return false; }

function getColorFamily(color) {
    const [h] = rgbToHsl(...color);

    if ((h >= 0 && h < 15) || (h >= 345 && h < 360)) return 'red'; // 🔴 keep reds at both ends
    if (h >= 15 && h < 50) return 'orange';
    if (h >= 50 && h < 80) return 'yellow';
    if (h >= 80 && h < 140) return 'green';
    if (h >= 140 && h < 180) return 'cyan';
    if (h >= 180 && h <= 240) return 'blue';
    if (h > 240 && h < 300) return 'purple';
    if (h >= 300 && h < 345) return 'magenta'; // 💗 pink/magenta only
    return 'neutral';
}



function groupColorsByFamily(colors) {
    const families = {};
    colors.forEach((color) => {
        const family = getColorFamily(color);
        if (!families[family]) families[family] = [];
        families[family].push({ color, hsl: rgbToHsl(...color) });
    });
    return families;
}

// === palette generation ===
function applyBrightnessLevelWithYellow(baseLightness, level, hue) {
    const isYellow = hue >= 50 && hue <= 70;
    const variations = {
        'very-bright': 90,
        'bright': 80,
        'dark': 30,
        'very-dark': 20,
        'normal': isYellow ? 65 : baseLightness
    };
    let newLightness = variations[level] || baseLightness;
    return Math.max(10, Math.min(95, newLightness));
}
function generateBrightnessPattern(length) {
    const levels = ['very-bright','bright','normal','dark','very-dark'];
    return Array.from({length},()=>levels[Math.floor(Math.random()*levels.length)]);
}
function generateDiversePalettes(baseColors) {
    const palettes = [];

    // 🔹 group input colors dynamically into families
    const groupedColors = {};
    baseColors.forEach(c => {
        const fam = getColorFamily(c);
        if (!groupedColors[fam]) groupedColors[fam] = [];
        groupedColors[fam].push(c);
    });

    // 🔹 pick one representative color from each family (shuffled)
    let firstColors = [];
    Object.values(groupedColors).forEach(family => {
        firstColors.push(...shuffleArray(family).slice(0, 1));
    });
    firstColors = shuffleArray(firstColors).slice(0, 2); // only 2 palettes for now

    // 🔹 Convert base colors into HSL
    const baseHslValues = baseColors.map(color => {
        const hsl = rgbToHsl(...color);
        return { h: hsl[0], s: hsl[1], l: hsl[2], isBackground: false };
    });

    // 🔹 Generate palettes
    firstColors.forEach(mappingColor => {
        const newPalette = [];
        const mappingHsl = rgbToHsl(...mappingColor);
        const firstColorOriginal = baseHslValues[0];
        const brightnessPattern = generateBrightnessPattern(baseColors.length);

        baseColors.forEach((originalColor, idx) => {
            const originalHsl = baseHslValues[idx];
            const brightness = brightnessPattern[idx];

            if (idx === 0) {
                // anchor color
                let [h, s, l] = mappingHsl;
                s = Math.max(60, s);
                l = applyBrightnessLevelWithYellow(l, brightness, h);
                newPalette.push(hslToRgb(h, s, l));
            } else {
                // shift relative hues
                let hueDiff = (originalHsl.h - firstColorOriginal.h + 360) % 360;
                let newHue = (mappingHsl[0] + hueDiff) % 360;
                let newSat = Math.max(20, Math.min(95, originalHsl.s));
                let newLight = applyBrightnessLevelWithYellow(originalHsl.l, brightness, newHue);
                newPalette.push(hslToRgb(newHue, newSat, newLight));
            }
        });
        palettes.push(newPalette);
    });

    return palettes;
}
// === run demo ===
// 20 distinct base colors
const baseColors=[
  [255,0,0], [0,0,255], [255,165,0], [255,255,0], [128,0,128],
  [255,105,180], [0,255,255], [255,20,147], [75,0,130], [255,99,71],
  [0,191,255], [255,140,0], [186,85,211], [199,21,133], [220,20,60],
  [30,144,255], [123,104,238], [255,182,193], [138,43,226], [255,69,0]
];

// Show families
const families=groupColorsByFamily(baseColors);
const familyDiv=document.getElementById("families");
Object.entries(families).forEach(([name,colors])=>{
    const div=document.createElement("div");
    div.className="family";
    div.innerHTML=`<strong>${name}:</strong> `;
    colors.forEach(c=>{
        const sw=document.createElement("div");
        sw.className="swatch";
        sw.style.background=`rgb(${c.color.join(",")})`;
        div.appendChild(sw);
    });
    familyDiv.appendChild(div);
});

// Show original palette
const orig=document.getElementById("original");
const row=document.createElement("div");
row.className="palette";
row.innerHTML=`<span>Original:</span>`;
baseColors.forEach(c=>{
    const d=document.createElement("div");
    d.style.background=`rgb(${c.join(",")})`;
    row.appendChild(d);
});
orig.appendChild(row);

// Show generated palettes
const palettes=generateDiversePalettes(baseColors);
const palettesDiv=document.getElementById("palettes");
palettes.forEach((palette,i)=>{
    const row=document.createElement("div");
    row.className="palette";
    row.innerHTML=`<span>Palette ${i+1}:</span>`;
    palette.forEach(c=>{
        const d=document.createElement("div");
        d.style.background=`rgb(${c.join(",")})`;
        row.appendChild(d);
    });
    palettesDiv.appendChild(row);
});
</script>
</body>
</html>
