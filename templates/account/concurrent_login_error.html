<!-- templates/account/concurrent_login_error.html -->
{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block head_title %}{% trans "Colorify Studio - Session Active" %}{% endblock %}

{% block extra_head %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="{% static "js/talwind3.14.js" %}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#5c6cff",
                    },
                },
            },
        };
    </script>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-3xl shadow-lg">
            <!-- Logo -->
            <div class="flex flex-col items-center mb-8">
                <!-- Session Active Message -->
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Session Active Elsewhere</h2>
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6">
                        <p class="text-amber-700">
                            {{ error_message }}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <form method="post" action="{% url 'reset-sessions-and-login' %}">
                    {% csrf_token %}
                    <input type="hidden" name="reset_token" value="{{ reset_token }}">
                    <button type="submit"
                            class="w-full text-white py-3 rounded-xl transition-colors text-center"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        Log out all devices and continue here
                    </button>
                </form>
                <a href="{% url 'account_login' %}" 
                   class="block w-full bg-white text-gray-700 py-3 rounded-xl hover:bg-gray-50 transition-colors text-center border border-gray-200">
                    Return to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
