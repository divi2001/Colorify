{% load static %}
<!-- Navigation Header -->
<div class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/60">
  <nav class="backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <div class="flex items-center gap-3 animate-fade-in-left">
          <a href="{% url 'home' %}">
            <img src="{% static 'images/logo2.png' %}" alt="Colorify Logo" width="190px" />
          </a>
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-8 animate-fade-in-up ">
            <a href="{% url 'home' %}"
              class="navigation-top hover:text-slate-900 font-light transition-all duration-300 hover:scale-105">Home</a>
            <a href="{% url 'about' %}"
              class="navigation-top hover:text-slate-900 font-light transition-all duration-300 hover:scale-105">About us</a>
            <a href="{% url 'plans' %}"
              class="navigation-top hover:text-slate-900 font-light transition-all duration-300 hover:scale-105">Pricing</a>
            <a href="{% url 'contact' %}"
              class="navigation-top hover:text-slate-900 font-light transition-all duration-300 hover:scale-105">Contact us</a>
            <!-- <a href="{% url 'home' %}#key-features"
              class="navigation-top hover:text-slate-900 font-light transition-all duration-300 hover:scale-105">Blog</a> -->

            <!-- Language Selector -->
            <div class="relative inline-block language-selector-wrapper">
              <select id="language-select" class="language-dropdown">
                <option value="">Select Language</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="gu">Gujarati</option>
                <option value="tr">Turkish</option>
                <option value="it">Italian</option>
                <option value="es">Spanish</option>
                <option value="zh-cn">Simplified Chinese</option>
                <option value="fr">French</option>
                <option value="vi">Vietnamese</option>
                <option value="ru">Russian</option>
              </select>
              <div id="google_translate_element" style="display: none;"></div>
            </div>
            
            {% if user.is_authenticated %}
                <a href="{% url 'account_logout' %}"
                  class="btn-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700">Logout</a>
            {% else %}
                <a href="{% url 'account_login' %}"
                  class="btn-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700">Login</a>
            {% endif %}
        </div>

        <!-- Mobile menu button -->
        <div class="md:hidden">
          <button id="mobile-menu-button" class="p-2 rounded-lg hover:bg-slate-100 transition-all duration-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu"
        class="mobile-menu md:hidden bg-white/95 backdrop-blur-md py-2 px-4 rounded-lg mt-2 shadow-xl border border-slate-200">
  <a href="{% url 'home' %}" class="block py-2 text-gray-600 hover:text-gray-900">Home</a>
  <a href="{% url 'about' %}" class="block py-2 text-gray-600 hover:text-gray-900">About us</a>
  <a href="{% url 'plans' %}" class="block py-2 text-gray-600 hover:text-gray-900">Pricing</a>
  <a href="{% url 'contact' %}" class="block py-2 text-gray-600 hover:text-gray-900">Contact us</a>
  <a href="{% url 'home' %}#key-features" class="block py-2 text-gray-600 hover:text-gray-900">Blog</a>
  <!-- Language Selector for Mobile -->
  <div class="py-2 language-selector-wrapper">
    <select id="language-select-mobile" class="language-dropdown w-full">
      <option value="">Select Language</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="gu">Gujarati</option>
      <option value="tr">Turkish</option>
      <option value="it">Italian</option>
      <option value="es">Spanish</option>
      <option value="zh-cn">Simplified Chinese</option>
      <option value="fr">French</option>
      <option value="vi">Vietnamese</option>
      <option value="ru">Russian</option>
    </select>
    <div id="google_translate_element_mobile" style="display: none;"></div>
  </div>
  
  {% if user.is_authenticated %}
      <a href="{% url 'account_logout' %}" class="btn-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700">Logout</a>
  {% else %}
      <a href="{% url 'account_login' %}" class="block w-full mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">Try it Now</a>
  {% endif %}
      </div>
    </div>
  </nav>
</div>
